<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>贪吃蛇 · 浏览器预览</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at 50% 20%, #0b1b22 0%, #03080b 60%);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      body {
        display: block;
      }

      #stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 375px;
        height: 812px;
        max-width: 100vw;
        max-height: 100vh;
        overflow: hidden;
        background: #071019;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
        touch-action: none;
      }

      @media (min-width: 600px) {
        body {
          display: flex;
          align-items: center;
          justify-content: center;
        }

        #stage {
          position: relative;
          left: auto;
          top: auto;
        }
      }

      #gameCanvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="gameCanvas"></canvas>
    </div>
    <script src="../miniprogram/game/core.js"></script>
    <script src="../miniprogram/game/controller.js"></script>
    <script src="../miniprogram/game/renderer.js"></script>
    <script src="./preview.js"></script>
  </body>
</html>
